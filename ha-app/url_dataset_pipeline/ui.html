<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL Dataset Pipeline</title>
<style>
  :root { color-scheme: light dark;
          --bg: #f5f6f8; --fg: #1f2328; --muted: #6b7280; --card: #fff; --line: #e4e6ea; --line2: #eef0f2;
          --chip: #eef0f2; --chip-hover: #dfe3e8; --accent: #2f9e44; --accent-hover: #278a3b;
          --warn-bg: #fdf0c8; --warn-fg: #8a6100; --err-bg: #fde2e2; --err-fg: #b42318;
          --ok-bg: #dcf3e1; --ok-fg: #1e6b30; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --fg: #e6e8eb; --card: #1e2126; --line: #2c3037; --line2: #24272d;
            --chip: #2c3037; --chip-hover: #3a3f47; --accent: #2f6f3e; --accent-hover: #3a8a4d;
            --warn-bg: #4a3b12; --warn-fg: #f2cc60; --err-bg: #4a1d1d; --err-fg: #ff9b9b;
            --ok-bg: #1d3b25; --ok-fg: #8fdca0; }
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px;
         background: var(--bg); color: var(--fg); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; }
  .head { display: flex; align-items: flex-start; justify-content: space-between;
          gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-block; font: inherit; font-size: 13px; text-decoration: none; cursor: pointer;
         background: var(--card); color: var(--fg); border: 1px solid var(--line);
         padding: 6px 12px; border-radius: 7px; white-space: nowrap; }
  .btn:hover:not(:disabled) { background: var(--chip); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-hover); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
          gap: 12px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
                 color: var(--muted); margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .value.small { font-size: 17px; }
  .card .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

  details.sec { margin-bottom: 8px; }
  details.sec > summary { cursor: pointer; list-style: none; display: flex; align-items: baseline;
                          gap: 10px; padding: 6px 0 10px; user-select: none; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: "▸"; color: var(--muted); font-size: 12px;
                                  transition: transform .15s; display: inline-block; }
  details.sec[open] > summary::before { transform: rotate(90deg); }
  details.sec > summary .meta { font-size: 12px; color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       margin: 0; display: inline; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 24px; }
  th, td { padding: 8px 10px; text-align: left; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
       font-weight: 600; border-bottom: 1px solid var(--line); }
  td { border-bottom: 1px solid var(--line2); }
  .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--muted); }
  .wrap { overflow-x: auto; }

  .tag { font-size: 10px; background: var(--chip); color: var(--muted); padding: 1px 6px;
         border-radius: 4px; white-space: nowrap; }
  .tag.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .tag.err { background: var(--err-bg); color: var(--err-fg); }

  /* Kaomoji from the terminal dashboard. Several glyphs come from fallback fonts with taller or
     shorter metrics, so each face lives in a fixed-size box: its frames can never change the
     height of the row or the width of the column around it. */
  .face { display: inline-block; width: 6.5em; height: 1.4em; line-height: 1.4em; overflow: visible;
          margin-left: 6px; font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted);
          white-space: pre; vertical-align: middle; }
  .face.work { color: var(--accent); }
  .card .face { display: block; width: auto; height: 1.5em; line-height: 1.5em; margin: 4px 0 0; font-size: 14px; }
  .bar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; min-width: 120px; }
  .bar > span { display: block; height: 100%; background: var(--accent); }
  pre.log { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
            font-size: 12px; line-height: 1.45; max-height: 420px; overflow: auto; white-space: pre-wrap;
            word-break: break-word; margin: 0 0 24px; }
  .empty { color: var(--muted); font-size: 14px; padding: 4px 0 20px; }
  .err-box { background: var(--err-bg); color: var(--err-fg); border-radius: 8px; padding: 10px 14px;
             font-size: 13px; margin-bottom: 16px; display: none; }
</style></head>
<body>
  <header class="head">
    <div>
      <h1>URL Dataset Pipeline</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <nav class="actions">
      <button class="btn primary" id="resumeBtn" disabled>Resume</button>
      <button class="btn" id="pauseBtn" disabled title="Stops the generator until you resume it; finished files are kept">Pause</button>
      <a class="btn" href="api/download" title="Inputs, outputs and report as .tar.gz">Download dataset</a>
    </nav>
  </header>
  <div class="err-box" id="err"></div>

  <div class="grid" id="cards"></div>

  <details class="sec" id="sec-workers" open>
    <summary><h2>Live workers</h2><span class="meta" id="workersMeta"></span></summary>
    <div id="workers"></div>
  </details>

  <details class="sec" id="sec-progress" open>
    <summary><h2>Progress per input folder</h2><span class="meta" id="progressMeta"></span></summary>
    <div id="progress"></div>
  </details>

  <details class="sec" id="sec-last" open>
    <summary><h2>Last 24 hours</h2><span class="meta" id="lastMeta"></span></summary>
    <div id="last"></div>
  </details>

  <details class="sec" id="sec-models" open>
    <summary><h2>Models</h2><span class="meta">accepted and rejected outputs, all time</span></summary>
    <div id="models"></div>
  </details>

  <details class="sec" id="sec-quota" open>
    <summary><h2>Daily quota</h2><span class="meta">accepted files per day · <b>*</b> = ran out of quota that day, so that is its real capacity</span></summary>
    <div id="quota"></div>
  </details>

  <details class="sec" id="sec-log">
    <summary><h2>Log</h2><span class="meta" id="logMeta"></span></summary>
    <pre class="log" id="log"></pre>
  </details>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const num = (n) => (n ?? 0).toLocaleString("en-GB");
const time = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "-";
const ago = (iso) => {
  if (!iso) return "-";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
};
// Same frames and state mapping as the terminal dashboard (render_dashboard in the generator)
const FACES = {
  work: ["ᓚ( `□´)ງ", "ᕦ(✧˙ж˙)ງ", "ᕦ(⊹°■°)ᕤ"],
  sleep: ["( ˊ³ˋ)ZZ", "( ˊ°ˋ)zZ", "( ˊ¤ˋ)zz", "( ˊOˋ)zZ", "( ˊ૦ˋ)ZZ", "( ˊ°ˋ)zZ", "( ˊ³ˋ)zz", "( ˊ3ˋ)zZ"],
  idle: ["( ˙Ⱉ˙)⊹", "( ˙Ⱉ˙)✧", "( ˙Ⱉ˙)⭒", "( ˙Ⱉ˙)*", "( ˙Ⱉ˙)₊"],
};
const STATE_FACE = {
  processing: "work", done: "idle", idle: "idle",
  cooldown: "sleep", waiting: "sleep", paused: "sleep", retired: "sleep", stopped: "sleep",
};
let frame = 0;
const faceText = (kind) => FACES[kind][frame % FACES[kind].length];
const face = (kind) => kind ? `<span class="face ${kind}" data-face="${kind}">${esc(faceText(kind))}</span>` : "";
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// The terminal redraws 4 times a second and shows each frame 3 times: one frame every 750 ms
if (!reduceMotion) {
  setInterval(() => {
    frame++;
    for (const el of document.querySelectorAll("[data-face]")) el.textContent = faceText(el.dataset.face);
  }, 750);
}
// What the worker is doing, or why the file it just had failed
const workerNote = (w) => {
  if (["rejected", "error"].includes(w.state) && w.note) return `${w.file || "-"}: ${w.note}`;
  if (["retired", "paused", "cooldown", "waiting"].includes(w.state) && w.note) return w.note;
  return w.file || "-";
};
const STATE_TAGS = {
  processing: "ok", done: "ok", skipped: "", idle: "", waiting: "warn", cooldown: "warn",
  rejected: "warn", error: "err", paused: "warn", retired: "err", stopped: "",
};

// Collapsed/expanded sections are remembered across visits
for (const sec of document.querySelectorAll("details.sec")) {
  try { const v = localStorage.getItem(sec.id); if (v !== null) sec.open = v === "1"; } catch {}
  sec.addEventListener("toggle", () => { try { localStorage.setItem(sec.id, sec.open ? "1" : "0"); } catch {} });
}

async function call(path, method = "GET") {
  const res = await fetch(path, { method, cache: "no-store" });
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

const days = (d) => d < 1 ? `${Math.round(d * 24)} h` : `${d.toFixed(1)} days`;

function renderState(s) {
  const r = s.runner, st = s.status, rec = s.recent || { done: 0, per_hour: 0, models: {} };
  const live = r.running && st && !st.finished;
  const total = s.progress.reduce((a, p) => a + p.total, 0);
  const done = s.progress.reduce((a, p) => a + p.done, 0);
  const left = total - done;
  const eta = rec.done ? days(left / rec.done) : "-";
  const paused = (st && st.paused) || [];
  const stateText = r.paused ? "Paused" : r.running ? (r.stopping ? "Stopping" : "Running") : "Restarting";

  $("sub").innerHTML = esc(r.paused ? "Paused from the panel · press Resume to continue"
    : r.running ? `Running continuously since ${time(r.started)} · ${rec.per_hour} files/h over the last 24 h`
    : `Not running (last exit ${r.last_exit ?? "-"}) · the app restarts it automatically`)
    + face(live && !r.stopping ? "work" : "sleep");
  $("resumeBtn").disabled = !r.paused;
  $("pauseBtn").disabled = r.paused || !r.running;

  $("cards").innerHTML = [
    ["Status", stateText, r.running ? `since ${time(r.started)}` : (r.paused ? "until you resume" : "restarting soon"),
      live && !r.stopping ? "work" : "sleep"],
    ["Dataset", `${total ? Math.floor(done * 100 / total) : 0}%`, `${num(done)} / ${num(total)} files`],
    ["Last 24 h", num(rec.done), `${rec.per_hour} files/h`],
    ["Files left", num(left), rec.done ? `about ${eta} at this pace` : "no pace yet"],
    ["Paused", num(paused.length), paused.length ? paused.map((p) => p.who.split(" / ")[0]).join(", ") : "every provider working"],
  ].map(([l, v, h, f]) => `<div class="card"><div class="label">${esc(l)}</div><div class="value${String(v).length > 8 ? " small" : ""}">${esc(v)}</div>${face(f)}<div class="hint">${esc(h)}</div></div>`).join("");

  // Live workers
  if (live && st.workers.length) {
    const busy = st.workers.filter((w) => w.state === "processing").length;
    $("workersMeta").textContent = `${busy} of ${st.workers.length} busy · ${num(st.resting ?? 0)} files resting after rejections · updated ${ago(st.updated)} ago`;
    $("workers").innerHTML = `<div class="wrap"><table><thead><tr><th>Worker</th><th>Provider</th><th>Status</th>
      <th class="n">Done</th><th class="n">Rej</th><th>File / note</th></tr></thead><tbody>${
      st.workers.map((w) => `<tr><td>${esc(w.label)}</td><td class="muted">${esc(w.provider)}</td>
        <td style="white-space:nowrap"><span class="tag ${STATE_TAGS[w.state] ?? ""}">${esc(w.state)}</span>${face(STATE_FACE[w.state])}</td>
        <td class="n">${num(w.done)}</td><td class="n">${num(w.rejected)}</td>
        <td class="muted">${esc(workerNote(w))}</td></tr>`).join("")
    }</tbody></table></div>`;
  } else {
    $("workersMeta").textContent = r.paused ? "paused" : "not running";
    $("workers").innerHTML = `<div class="empty">Workers show up here while the generator is running.</div>`;
  }

  // Progress per directory
  $("progressMeta").textContent = `${num(done)} / ${num(total)} files`;
  $("progress").innerHTML = s.progress.length ? `<div class="wrap"><table><thead><tr><th>Folder</th>
    <th style="width:45%">Progress</th><th class="n">Done</th><th class="n">Left</th></tr></thead><tbody>${
    s.progress.map((p) => {
      const pct = p.total ? (p.done * 100 / p.total) : 0;
      return `<tr><td>${esc(p.dir)}</td>
        <td><div class="bar" title="${pct.toFixed(1)}%"><span style="width:${pct}%"></span></div></td>
        <td class="n">${num(p.done)}</td><td class="n">${num(p.total - p.done)}</td></tr>`;
    }).join("")}</tbody></table></div>` : `<div class="empty">No dataset found in /share/url-dataset-pipeline/in_out-s.</div>`;

  // Last 24 hours: per model, plus the providers on pause and when they come back
  const byModel = Object.entries(rec.models || {});
  $("lastMeta").textContent = `${num(rec.done)} files · ${rec.per_hour}/h${rec.new_folders && rec.new_folders.length ? ` · new folders: ${rec.new_folders.join(", ")}` : ""}`;
  $("last").innerHTML = byModel.length || paused.length ? `<div class="wrap"><table><thead><tr><th>Model</th><th class="n">Done</th>
    <th class="n">Rejected</th><th class="n">API errors</th><th>Now</th></tr></thead><tbody>${
    [...new Set([...byModel.map(([m]) => m), ...paused.map((p) => p.who.split(" / ")[0])])].map((m) => {
      const v = (rec.models || {})[m] || { done: 0, rejected: 0, errors: 0 };
      const why = paused.filter((p) => p.who.split(" / ")[0] === m)
        .map((p) => `${p.reason}${p.until ? ` · back ${time(p.until)}` : " · for good"}`).join("; ");
      return `<tr><td>${esc(m)}</td><td class="n">${num(v.done)}</td><td class="n">${num(v.rejected)}</td>
        <td class="n">${num(v.errors)}</td><td class="muted">${why ? `<span class="tag warn">paused</span> ${esc(why)}` : "working"}</td></tr>`;
    }).join("")}</tbody></table></div>` : `<div class="empty">Nothing in the last 24 hours yet.</div>`;

  // Log
  $("logMeta").textContent = r.running ? "live" : "last lines of run.log";
  const box = $("log"), atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  box.textContent = (s.log || []).join("\n") || "No output yet.";
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function renderStats(s) {
  $("models").innerHTML = s.models.length ? `<div class="wrap"><table><thead><tr><th>Model</th><th class="n">Done</th>
    <th class="n">Rejected</th><th class="n">API errors</th><th class="n">Accept</th><th class="n">Links lost</th><th>Top rejection reasons</th></tr></thead><tbody>${
    s.models.map((m) => {
      const cls = m.accept_pct === null ? "" : m.accept_pct >= 70 ? "ok" : m.accept_pct >= 40 ? "warn" : "err";
      return `<tr><td>${esc(m.model)}</td>
        <td class="n">${num(m.done)}</td><td class="n">${num(m.rejected)}</td><td class="n">${num(m.errors ?? 0)}</td>
        <td class="n">${m.accept_pct === null ? "-" : `<span class="tag ${cls}">${m.accept_pct}%</span>`}</td>
        <td class="n">${m.lost_pct === null ? "-" : m.lost_pct + "%"}</td>
        <td class="muted">${m.reasons.map(([r, n]) => `<div>${esc(r)} (${num(n)} ${n === 1 ? "file" : "files"})</div>`).join("") || "-"}</td></tr>`;
    }).join("")}</tbody></table></div>` : `<div class="empty">No results yet.</div>`;

  const q = s.quota;
  $("quota").innerHTML = q.days.length ? `<div class="wrap"><table><thead><tr><th>Model</th>${
    q.days.map((d) => `<th class="n">${esc(d.slice(5))}</th>`).join("")}</tr></thead><tbody>${
    q.rows.map((row) => `<tr><td>${esc(row.model)}</td>${row.cells.map((c) => c === null
      ? '<td class="n muted">-</td>'
      : `<td class="n"${c.stop ? ` title="${esc(c.stop)}"` : ""}>${num(c.done)}${c.capped ? "<b>*</b>" : ""}</td>`).join("")}</tr>`).join("")
    }</tbody></table></div>` : `<div class="empty">No daily data yet.</div>`;
}

async function refreshState() {
  try { renderState(await call("api/state")); $("err").style.display = "none"; }
  catch (e) { $("err").textContent = `Could not reach the app: ${e.message}`; $("err").style.display = "block"; }
}
async function refreshStats() {
  try { renderStats(await call("api/stats")); } catch {}
}

$("resumeBtn").addEventListener("click", async () => {
  $("resumeBtn").disabled = true;
  await call("api/resume", "POST").catch(() => {});
  setTimeout(refreshState, 1500);
});
$("pauseBtn").addEventListener("click", async () => {
  $("pauseBtn").disabled = true;
  await call("api/pause", "POST").catch(() => {});
  setTimeout(refreshState, 1500);
});

refreshState(); refreshStats();
setInterval(refreshState, 5000);
setInterval(refreshStats, 60000);
</script>
</body></html>
