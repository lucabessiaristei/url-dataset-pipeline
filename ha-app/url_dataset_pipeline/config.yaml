name: URL Dataset Pipeline
version: "2.0.1"
slug: url_dataset_pipeline
description: Passive dataset creator - categorizes bookmarks around the clock on free APIs (NVIDIA first, free quotas on top)
arch:
  - amd64
  - aarch64
init: false
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:database-cog-outline
panel_title: URL Dataset
map:
  - share:rw
options:
  nvidia_workers: 6
  max_input_folders: 10
  digest_time: "09:00"
  models: ""
  gemini_api_key: ""
  groq_api_key: ""
  openrouter_api_key: ""
  nvidia_api_key: ""
schema:
  nvidia_workers: int(1,40)
  max_input_folders: int(1,50)
  digest_time: match(^([01]\d|2[0-3]):[0-5]\d$)
  models: str?
  gemini_api_key: password?
  groq_api_key: password?
  openrouter_api_key: password?
  nvidia_api_key: password?
